name: Release

# Label-driven releases. Merging a PR into the default branch with a
# `release:patch`, `release:minor` or `release:major` label bumps the version
# (in lockstep across the Python and JS packages), tags it, and publishes to
# both PyPI and npm. `workflow_dispatch` provides a manual fallback.
#
# Required configuration (repository secrets):
#   - PyPI: `PYPI_API_TOKEN` (a PyPI API token with upload rights for `bigquery-mcp`).
#   - npm:  `NPM_TOKEN` (an automation token with publish rights).

on:
  pull_request:
    types: [closed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump level"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decide whether to release and at what bump level.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.decide.outputs.level }}
    steps:
      - name: Determine bump level
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          DISPATCH_LEVEL: ${{ github.event.inputs.level }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "level=$DISPATCH_LEVEL" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MERGED" != "true" ]; then
            echo "level=none" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          case ",$LABELS," in
            *,release:major,*) echo "level=major" >>"$GITHUB_OUTPUT" ;;
            *,release:minor,*) echo "level=minor" >>"$GITHUB_OUTPUT" ;;
            *,release:patch,*) echo "level=patch" >>"$GITHUB_OUTPUT" ;;
            *) echo "level=none" >>"$GITHUB_OUTPUT" ;;
          esac

  # Quality gates must pass before we cut a release.
  test-python:
    needs: prepare
    if: needs.prepare.outputs.level != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - run: make check
      - run: uv run python -m pytest tests

  test-js:
    needs: prepare
    if: needs.prepare.outputs.level != 'none'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  # Bump versions in lockstep, commit, and tag.
  bump:
    needs: [prepare, test-python, test-js]
    if: needs.prepare.outputs.level != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - name: Bump version
        id: bump
        run: echo "version=$(bun scripts/bump-version.ts ${{ needs.prepare.outputs.level }})" >>"$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag "$VERSION"
          BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
          git push origin "HEAD:$BRANCH"
          git push origin "$VERSION"

  # Publish the Python package to PyPI using an API token.
  release-pypi:
    needs: [prepare, bump]
    if: needs.prepare.outputs.level != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.version }}
      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
      - name: Build package
        run: make build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Publish the JS package to npm with Bun.
  release-npm:
    needs: [prepare, bump]
    if: needs.prepare.outputs.level != 'none'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.version }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty — set it in repo settings." >&2
            exit 1
          fi
          # Write both a home and project .npmrc so bun publish reliably picks up
          # the auth token regardless of which it reads first.
          printf '%s\n' \
            "registry=https://registry.npmjs.org/" \
            "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" \
            "always-auth=true" | tee ~/.npmrc .npmrc >/dev/null
          bun publish --access public

  # Create a GitHub Release with generated notes (uses GITHUB_TOKEN, so it does
  # not retrigger this workflow).
  github-release:
    needs: [prepare, bump, release-pypi, release-npm]
    if: needs.prepare.outputs.level != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
